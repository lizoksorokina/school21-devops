stages:
    - build
    - style_test
    - test
    - deploy

build-job:
    stage: build
    tags:
        - runner
    script:
        - cd src/cat && make
        - cd ../grep && make
    artifacts:
        paths:
            - src/cat/s21_cat
            - src/grep/s21_grep
        expire_in: 30 days
    only:
        - develop

codestyle:
    stage: style_test
    tags:
        - runner
    script:
        - cp materials/linters/.clang-format src/
        - clang-format -n -Werror src/*/*.c
    only:
        - develop

test:
    stage: test
    tags: 
        - runner
    script:
        - cd src/cat && make test
        - cd ../grep && make test
    only:
        - develop

deploy:
    stage: deploy
    tags: 
        - runner
    script:
        - cd src
        - bash deploy.sh
    when: manual
    only:
        - develop
